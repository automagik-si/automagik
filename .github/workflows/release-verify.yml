name: Release verification

on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - '.github/node-versions.json'
      - 'scripts/release-verification*'
      - 'scripts/release-gates.sh'
  workflow_call:
    outputs:
      sha:
        value: ${{ jobs.plan.outputs.sha }}
      node:
        value: ${{ jobs.plan.outputs.node }}
      release:
        value: ${{ jobs.plan.outputs.release }}
      herdr:
        value: ${{ jobs.plan.outputs.herdr }}
      meter:
        value: ${{ jobs.plan.outputs.meter }}
      pocket:
        value: ${{ jobs.plan.outputs.pocket }}

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Pin the release inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      node: ${{ steps.node.outputs.version }}
      release: ${{ github.event_name == 'pull_request' && 'true' || steps.new.outputs.release }}
      herdr: ${{ steps.lane.outputs.herdr }}
      meter: ${{ steps.lane.outputs.meter }}
      pocket: ${{ steps.lane.outputs.pocket }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && github.sha || 'dev' }}
          fetch-depth: 0
          fetch-tags: true

      # One Node version for both jobs (#1645): the release reads the same file CI's herdr and am
      # matrix reads, and runs the exact `release` version, which must be one of that matrix's
      # legs. They have to stay in step: a Node minor can change filesystem, network or process
      # behaviour, and 24.0-24.13.0's rmSync followed a symlink to a directory where 24.18
      # unlinked it, so a release on 24.9.0 failed for hours while every PR check on 22 + latest
      # 24 passed. Do not write a Node version into either workflow outside this file.
      - name: The Node version CI gates the release on
        id: node
        run: |
          set -euo pipefail
          release=$(jq -r '.release' .github/node-versions.json)
          if [[ ! "${release}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release Node version '${release}' in .github/node-versions.json is not exact x.y.z"
            exit 1
          fi
          if ! jq -e --arg version "${release}" '.ci | index($version)' .github/node-versions.json > /dev/null; then
            echo "::error::release Node version '${release}' is not one of the ci matrix legs in .github/node-versions.json"
            exit 1
          fi
          echo "version=${release}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Anything new since the last release
        id: new
        run: |
          set -euo pipefail
          # The newest release, a full one or a plugin patch (calendar tags have six-digit minors).
          last=$(git tag --list 'v3.*' --sort=-v:refname | grep -E '^v3\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$' | head -1 || true)
          if [[ -z "${last}" ]]; then
            # The first release: everything since the beginning ships.
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # The path decision is authoritative, not the subjects: PR #759's test(pocket) squash
            # merge touched Pocket's shipped Kotlin source while its subject looked inert (#767).
            # Ask ships first; a failure stops the run instead of reading as "nothing reaches an
            # install".
            ships=$(bun scripts/lane.ts ships "${last}")
            if [[ "${ships}" == "yes" ]]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            elif [[ "${ships}" != "no" ]]; then
              echo "::error::scripts/lane.ts ships ${last} printed '${ships}', not yes or no"
              exit 1
            else
              # The subjects are only a fast path to the wording: all inert (the release's own
              # version commit and index listing, CI, docs, tests) with nothing shipping is "dev
              # has nothing"; any other subject reaches no install either when the diff ships
              # nothing (a plugin's dev tools, its lint script: not in its package's files).
              subjects=$(git log --no-merges --format=%s "${last}..HEAD" \
                | grep -vE '^(chore\(release\)|ci|docs|test)(\([^)]*\))?!?: ' || true)
              if [[ -n "${subjects}" ]]; then
                echo "nothing since ${last} reaches an install: no release"
              else
                echo "dev has nothing since ${last}: no release"
              fi
            fi
          fi

      - name: Determine the verification groups
        id: lane
        if: steps.new.outputs.release == 'true'
        run: bash scripts/release-gates.sh lane

      - id: plan
        env:
          ships: ${{ (github.event_name == 'pull_request' || steps.new.outputs.release == 'true') && 'yes' || 'no' }}
          herdr: ${{ github.event_name == 'pull_request' && 'yes' || steps.lane.outputs.herdr }}
          meter: ${{ steps.lane.outputs.meter }}
          pocket: ${{ steps.lane.outputs.pocket }}
        run: node scripts/release-verification.mjs plan

      - name: No release needed
        if: github.event_name != 'pull_request' && steps.new.outputs.release != 'true'
        run: echo '### No changes to publish' >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify ${{ matrix.gate }} ${{ matrix.key }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: verify-release-${{ github.event_name == 'pull_request' && github.run_id || 'dev' }}-${{ matrix.gate }}-${{ matrix.key }}
      queue: max
    env:
      DO_NOT_TRACK: '1'
      GATE: ${{ matrix.gate }}
      KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ needs.plan.outputs.node }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Look for a successful run of these inputs
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-verification.mjs lookup "$GATE" "$KEY"

      - name: herdr-app system libraries
        if: matrix.gate == 'herdr-static'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-x11-0 libxcb-xkb1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.gate == 'pocket'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: matrix.gate == 'pocket'
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: matrix.gate == 'pocket'

      - name: Verified on ${{ steps.receipt.outputs.image }}
        if: steps.receipt.outputs.reuse != 'true'
        run: node scripts/release-verification.mjs verify "$GATE" "$KEY"

      - name: Report verification failure
        if: failure()
        run: echo "Verification failed for \`$GATE\`. Publication is blocked." >> "$GITHUB_STEP_SUMMARY"
