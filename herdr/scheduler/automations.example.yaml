# Copy to your plugin config dir (herdr plugin config-dir dnzzl.automations)
# as automations.yaml — or let `herdr-automations add` write it for you.
automations:
  - name: issue-triage
    cron: "0 9 * * 1-5"
    repo: ~/Projects/myapp
    workspace: worktree
    # Optional: provision every run in this Herdr session, kept apart from the
    # ones you work in. It must be running; the plugin never starts it.
    session: automations
    agent: claude
    # Passed to the agent as --model. Leave it out and the agent picks for
    # itself — which is how an unattended chore lands on a flagship model.
    model: sonnet
    prompt: |
      Triage new GitHub issues: label them, close duplicates,
      draft replies for the ones needing more info.
    mcp_config: ~/.config/mcp/github.json
    timeout_minutes: 45
    # If the machine was asleep at 09:00, run on wake — but only within 2h.
    catch_up_minutes: 120
    # Leave the workspace open: each morning's triage is meant to be read.
    close_workspace: never

  # No agent, no model: the scheduler runs the program itself, as you.
  # Exit 0 is done; anything else, or the timeout, is failed.
  - name: daily-check
    cron: "0 7 * * *"
    command:
      argv: ["./check.sh", "--all"]
      cwd: ~/checks
      env:
        REGION: eu
    timeout_minutes: 10
    # Optional: send the one-line result to this bot (hc send).
    # notify: b-xxxxxxxx

  # A target hands the prompt to a bot, or to a worker of one, instead of
  # starting a fresh agent. It needs `backend: hc` at the top of the file (bots
  # live in herdr-core). `repo` is the project whose .herdr/bots.json names the
  # bot; the bot is named by its id, never by a terminal address.
  # `bot:` pastes the prompt into the bot's own terminal (starting it first when
  # it is not running); `worker:` starts a worker of it for the run and ends it
  # when the run finishes. A failure or timeout saves its screen before
  # removing the worker's terminal (ADR 0015).
  #
  # - name: housekeeping
  #   cron: "0 9 * * *"
  #   repo: ~/Projects/house
  #   target: bot:b-6jrz4bmxml
  #   # queue (the default) hands the prompt over for the bot's next turn;
  #   # skip drops this occurrence and records it skipped, like an overlap.
  #   target_when_busy: queue
  #   prompt: |
  #     Tidy the house: the checks every morning, and the reports that pile up.
  #
  # - name: review-queue
  #   cron: "0 10 * * *"
  #   repo: ~/Projects/house
  #   target: worker:b-6jrz4bmxml
  #   prompt: |
  #     Review the queue and leave your notes in the worker's reply.

  - name: nightly-deps
    cron: "@daily"
    repo: ~/Projects/myapp
    workflow: bump-dependencies   # delegated to herdr-workflows: hwf run bump-dependencies
    disabled: true
