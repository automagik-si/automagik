<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>WaitlistForm</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css"><style>*,*::before,*::after{animation:none!important}</style></head>
<body>
<div class="wrap" style="padding-block:20px;max-width:820px"><div class="form-card"><form class="waitlist-form">
    <input type="hidden" name="action" value="add">
    <label>What would you like to do?<textarea name="goal" required="" maxlength="1000" rows="3" placeholder="Tell us the work you want your agents to take on."></textarea></label>
    <div class="field-row"><label>Where would you use it?<select name="platform" required=""><option value="android">Android</option><option value="linux">Linux</option><option value="both">Android and Linux</option></select></label><label>Apps or tools <span class="muted">(optional)</span><input name="apps" maxlength="200" placeholder="The tools involved in your work"></label></div>
    <label>What would a good result look like?<textarea name="expected_result" required="" maxlength="500" rows="2" placeholder="Describe the outcome you would like."></textarea></label>
    <input type="hidden" name="channel" value="email">
    <div class="field-row"><label>Your email<input type="email" name="email" autocomplete="email" maxlength="254" required="" placeholder="you@example.com"></label><label>Confirmation language<select name="language"><option value="en">English</option><option value="pt-BR">Português</option></select></label></div>
    <label class="consent"><input type="checkbox" name="consent" value="yes" required=""><span>I agree to the use of my contact details and answers to record and review my interest in Automagik Cloud, and to one confirmation through my chosen channel. This does not create an account or sign me up for marketing. <a href="#">Privacy and removal</a>.</span></label>
    <button class="button primary" type="submit">Register my interest <span aria-hidden="true">→</span></button>
    <p class="fine">We send one email with a confirmation link, and nothing else.</p>
  </form></div></div>
</body>
</html>
