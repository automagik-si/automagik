# The automagik-web server's own dsh profile. It mirrors the desktop profile's safety rows
# (apps/desktop/profile/cordis.patch.yml) without the app-only ones: no plugin-market row
# (the image loads no market bundle) and no Omni-specific rows.
- insert:
    - id: web-search-auto
      name: '@automagik/bots-dsh/web-search'
# Web presets own their file tools. Keep the global adapters off unless the profile enables them.
- insert:
    - id: automagik-read-scope-files
      name: '@automagik/bots-dsh/read-scope-files'
      disabled: true
      config:
        applyPatch: false
- insert:
    - id: automagik-read-scope-search
      name: '@automagik/bots-dsh/read-scope-search'
      disabled: true
      config:
        sampleOverCapGlobResults: false
# These adapters retain DSH's definitions and attest the providers used by their bodies.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: true
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: true
- id: web
  config:
    searchProvider: auto
    fetchProvider: http
# Web fetch is on. DSH's HTTP provider has no address policy of its own, so bots-dsh gates
# the web_fetch tool with the address lists on Settings -> Browser. Both lists start empty:
# local, LAN and tailnet targets are reachable by default. A deny entry always wins, and a
# non-empty allow list limits both web_fetch and the Bot browser to those targets.
# The Settings lists are shared with the Bot browser, so they cannot turn web fetch
# off; only this row with disabled: true does. With both lists empty, prompt-injected
# channel text can still reach localhost services (#521): add a deny entry or disable
# this row.
- id: web-fetch-http
  disabled: false
# Read before write stays on: dsh 0.2.2 ships the policy row disabled, so write would overwrite
# and edit would replace a file the model never read. apply_patch stays off (dsh 0.2.2-rc.2
# already disables it in this profile's presets): it applies hunks on context alone, bypassing
# the read this row requires.
- id: fs-observation-policy
  disabled: false
# DSH's own welcome notice and credential step stay off: the welcome plugin is the server's
# Connect AI surface. DSH compares the notice version exactly: it stays a quoted string.
- id: ui-settings-general
  config:
    welcomeNoticeVersion: '2026-09-28.1'
- id: ui-settings-models
  config:
    credentialOnboarding: false
