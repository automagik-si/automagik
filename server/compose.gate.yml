# Opt-in C2.1 topology. No port or host network: a future ingress must share this namespace.
# Use the same digest-pinned AUTOMAGIK_SERVER_IMAGE for both services.
services:
  dsh:
    image: ${AUTOMAGIK_SERVER_IMAGE:?set a server image digest}
    environment:
      AUTOMAGIK_GATE_CLOUD_WORKSPACE: ${AUTOMAGIK_GATE_CLOUD_WORKSPACE:-}
      AUTOMAGIK_MULTIUSER: ${AUTOMAGIK_MULTIUSER:-0}
      AUTOMAGIK_CALLER_KEYS: /caller-keys/caller-keys.json
    volumes:
      - dsh-data:/data
      - caller-keys:/caller-keys:ro
  gate:
    profiles: [gate]
    image: ${AUTOMAGIK_SERVER_IMAGE:?set a server image digest}
    entrypoint: [/nodejs/bin/node, /opt/automagik/gate-entrypoint.mjs]
    depends_on:
      dsh:
        condition: service_healthy
    network_mode: service:dsh
    environment:
      AUTOMAGIK_GATE_MULTIUSER: ${AUTOMAGIK_MULTIUSER:-0}
      AUTOMAGIK_GATE_CALLER_PUBLIC: /caller-keys
      AUTOMAGIK_GATE_ENABLED: ${AUTOMAGIK_GATE_ENABLED:-0}
      AUTOMAGIK_GATE_ORIGIN: ${AUTOMAGIK_GATE_ORIGIN:?set the exact public origin}
      AUTOMAGIK_GATE_PORT: '3082'
      AUTOMAGIK_GATE_HOST: ${AUTOMAGIK_GATE_HOST:-127.0.0.1}
      AUTOMAGIK_GATE_CLAIM: ${AUTOMAGIK_GATE_CLAIM:-local}
      AUTOMAGIK_GATE_BOOTSTRAP_PORT: ${AUTOMAGIK_GATE_BOOTSTRAP_PORT:-3083}
      AUTOMAGIK_GATE_ACCESS_TEAM_DOMAIN: ${AUTOMAGIK_GATE_ACCESS_TEAM_DOMAIN:-}
      AUTOMAGIK_GATE_ACCESS_AUD: ${AUTOMAGIK_GATE_ACCESS_AUD:-}
      AUTOMAGIK_GATE_ACCESS_EMAILS: ${AUTOMAGIK_GATE_ACCESS_EMAILS:-}
      AUTOMAGIK_GATE_CLOUD_ISSUER: ${AUTOMAGIK_GATE_CLOUD_ISSUER:-}
      AUTOMAGIK_GATE_CLOUD_IDENTITY_ISSUER: ${AUTOMAGIK_GATE_CLOUD_IDENTITY_ISSUER:-}
      AUTOMAGIK_GATE_CLOUD_WORKSPACE: ${AUTOMAGIK_GATE_CLOUD_WORKSPACE:-}
      AUTOMAGIK_GATE_CLOUD_KEYS_URL: ${AUTOMAGIK_GATE_CLOUD_KEYS_URL:-}
      AUTOMAGIK_GATE_CLOUD_EXCHANGE_URL: ${AUTOMAGIK_GATE_CLOUD_EXCHANGE_URL:-}
      AUTOMAGIK_GATE_CLOUD_RAIL_ORIGIN: ${AUTOMAGIK_GATE_CLOUD_RAIL_ORIGIN:-}
      AUTOMAGIK_GATE_CLOUD_REVOCATION_URL: ${AUTOMAGIK_GATE_CLOUD_REVOCATION_URL:-}
    volumes:
      - gate-data:/data
      - caller-keys:/caller-keys
      # DSH creates this view on old volumes before its first healthy check. It contains only
      # the launch credential and the profile health report. DSH_HOME and the rest of the volume
      # stay private. volume.subpath needs Docker Engine 26 and Compose 2.26 or later.
      - type: volume
        source: dsh-data
        target: /dsh-view
        read_only: true
        volume:
          subpath: gate-view
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  dsh-data:
  gate-data:
  caller-keys:
